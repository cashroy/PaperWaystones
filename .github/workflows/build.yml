name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      modrinth_version:
        description: "Publish this build to Modrinth as version (e.g. v1.0.0). Leave blank to just build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.modrinth_version || '' }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin jar
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PaperWaystones-jar
          path: build/libs/*.jar

      - name: GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          prerelease: true

      - name: Publish to Modrinth (tags only, needs MODRINTH_TOKEN secret)
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.modrinth_version != '') && env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: 16iFCfUA
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/*.jar
          name: Paper Waystones ${{ env.RELEASE_VERSION }}
          version: ${{ env.RELEASE_VERSION }}
          version-type: beta
          loaders: |
            paper
            purpur
          game-versions: |
            26.3
          java: |
            25
